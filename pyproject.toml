[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openajazz"
dynamic = ["version"]
description = "Unofficial control for AJAZZ keyboards (AK820 Max Plus so far): lighting, per-key RGB, remaps, macros, music sync. CLI, TUI and web."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shreyas Deb", email = "shreyasdeb@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["rich>=12", "textual>=3.0"]
keywords = ["ajazz", "ak820", "ak820 max plus", "keyboard", "mechanical keyboard", "rgb", "hid", "hidraw", "linux", "tui", "macro"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]

[project.urls]
"Web app" = "https://openajazz.vercel.app"
Homepage = "https://github.com/shrey715/openajazz"
Releases = "https://github.com/shrey715/openajazz/releases"
Issues = "https://github.com/shrey715/openajazz/issues"
Protocol = "https://github.com/shrey715/openajazz/blob/main/PROTOCOL.md"

[project.scripts]
openajazz = "openajazz.cli:main"

[project.optional-dependencies]
music = ["numpy>=1.21"]
dev = ["pytest"]

[tool.setuptools]
packages = ["openajazz"]

[tool.setuptools.dynamic]
version = { attr = "openajazz.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
