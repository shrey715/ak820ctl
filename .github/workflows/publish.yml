name: publish

# Runs on every push to main. Releases only when the version in
# ak820/__init__.py isn't on PyPI yet, so bumping the version = a release:
# PyPI upload (trusted publishing, no token stored anywhere), an AppImage,
# and a GitHub release with install notes. The web app deploys separately
# through Vercel's git integration.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,music]"
      - run: pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
      contents: write  # tag + github release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: check whether this version is already on pypi
        id: version
        run: |
          v=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('ak820/__init__.py').read()).group(1))")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if curl -sfo /dev/null "https://pypi.org/pypi/ak820ctl/$v/json"; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "$v is already on pypi, nothing to publish"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: build
        if: steps.version.outputs.new == 'true'
        run: pip install build && python -m build

      - name: upload to pypi
        if: steps.version.outputs.new == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: build appimage
        if: steps.version.outputs.new == 'true'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          mkdir -p release
          mv dist/* release/
          packaging/appimage/build.sh
          mv dist/*.AppImage release/

      - name: github release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          cat > notes.md <<EOF
          ## Get it

          **No install:** open **https://ak820ctl.vercel.app** in Chrome, Edge or Opera on a computer.

          **Terminal (CLI + TUI):**
          \`\`\`sh
          pipx install 'ak820ctl[music]'      # or
          uv tool install 'ak820ctl[music]'   # or
          pip install --user 'ak820ctl[music]'
          \`\`\`

          **AppImage (Linux, nothing else needed):**
          \`\`\`sh
          curl -LO https://github.com/${{ github.repository }}/releases/download/v$V/ak820ctl-$V-x86_64.AppImage
          chmod +x ak820ctl-$V-x86_64.AppImage && ./ak820ctl-$V-x86_64.AppImage
          \`\`\`

          On Linux, run \`ak820ctl udev --install\` once so you don't need sudo.
          Unofficial, not affiliated with AJAZZ.

          EOF
          sed -i 's/^          //' notes.md
          gh release create "v$V" release/* --title "v$V" --notes-file notes.md --generate-notes
